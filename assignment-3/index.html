<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAWG Game Search</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/app.js" defer></script>
</head>
<body>
    <header>
        <h1>RAWG Game Search</h1>
        <p id="student-info"></p>
    </header>
    <form>
        <label for="search">Search for a Game:</label>
        <input type="text" id="search" class="search" placeholder="Enter game title" required>
        <button type="submit" class="submit">Search</button>
    </form>
    <section class="results"></section>
    <footer>
        <p><a href="https://rawg.io/apidocs" target="_blank">RAWG Video Game Database API</a></p>
    </footer>
</body>
</html>
